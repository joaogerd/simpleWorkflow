name: JOSS paper build

on:
  push:
    paths:
      - "paper/**"
      - ".github/workflows/joss-paper.yml"
  pull_request:
    paths:
      - "paper/**"
      - ".github/workflows/joss-paper.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    name: Compile JOSS draft
    runs-on: ubuntu-latest
    steps:
      - name: Check out manuscript
        uses: actions/checkout@v4
      - name: Build JOSS PDF using Open Journals
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md
      - name: Upload compiled draft
        uses: actions/upload-artifact@v4
        with:
          name: joss-paper-draft
          path: paper/paper.pdf
          if-no-files-found: error
