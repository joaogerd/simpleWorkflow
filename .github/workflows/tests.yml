name: Tests

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint package
        run: python -m ruff check --fix --diff simpleworkflow/tui_inspector.py
      - name: Type check execution core
        run: python -m mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests with coverage
        run: python -m pytest --cov=simpleworkflow --cov-report=term-missing --cov-fail-under=75
      - name: Validate published examples
        run: |
          for workflow in examples/*.yaml examples/cycle/*.yaml; do
            swf plan "$workflow" --color never
          done

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
          test -n "$(ls dist/*.whl)"
          test -n "$(ls dist/*.tar.gz)"
      - name: Install core-only wheel in a clean environment
        run: |
          python -m venv /tmp/simpleworkflow-core
          /tmp/simpleworkflow-core/bin/python -m pip install --upgrade pip
          WHEEL="$(ls dist/*.whl)"
          /tmp/simpleworkflow-core/bin/python -m pip install "$WHEEL"
          /tmp/simpleworkflow-core/bin/python - <<'PY'
          import importlib.util
          import simpleworkflow
          import simpleworkflow.cli
          assert simpleworkflow is not None
          assert importlib.util.find_spec("textual") is None
          assert importlib.util.find_spec("rich") is None
          PY
          cat > /tmp/core-workflow.yaml <<'YAML'
          workflow:
            name: clean_core_install
          tasks:
            - name: hello
              argv: [python, -c, "print('core ok')"]
          YAML
          /tmp/simpleworkflow-core/bin/swf run /tmp/core-workflow.yaml --ui plain --color never
          /tmp/simpleworkflow-core/bin/swf run /tmp/core-workflow.yaml --color never
      - name: Install TUI extra from the built wheel
        run: |
          python -m venv /tmp/simpleworkflow-tui
          /tmp/simpleworkflow-tui/bin/python -m pip install --upgrade pip
          WHEEL="$(ls dist/*.whl)"
          /tmp/simpleworkflow-tui/bin/python -m pip install "${WHEEL}[tui]"
          /tmp/simpleworkflow-tui/bin/python - <<'PY'
          import rich
          import textual
          import simpleworkflow.tui
          assert rich is not None
          assert textual is not None
          PY
          cat > /tmp/tui-workflow.yaml <<'YAML'
          workflow:
            name: clean_tui_install
          tasks:
            - name: hello
              argv: [python, -c, "print('tui ok')"]
          YAML
          /tmp/simpleworkflow-tui/bin/swf monitor --help
          TERM=xterm timeout 20 script -qec "/tmp/simpleworkflow-tui/bin/swf run /tmp/tui-workflow.yaml --workdir /tmp/tui-state --ui tui --color never" /dev/null
          /tmp/simpleworkflow-tui/bin/python - <<'PY'
          import asyncio
          from pathlib import Path
          from simpleworkflow.config import load_workflow
          from simpleworkflow.tui import WorkflowTui

          workflow = Path("/tmp/tui-workflow.yaml")
          config = load_workflow(workflow)
          app = WorkflowTui(
              config=config,
              workflow_path=workflow,
              workdir=Path("/tmp/tui-state"),
              refresh_seconds=60,
          )

          async def smoke():
              async with app.run_test(size=(100, 30)) as pilot:
                  await pilot.pause()
                  assert app.query_one("#task-tree") is not None
                  await pilot.press("q")

          asyncio.run(smoke())
          PY
      - name: Render persisted TUI demonstrations
        run: |
          /tmp/simpleworkflow-tui/bin/python tools/render_tui_demos.py --output-dir /tmp/tui-demos
          test "$(find /tmp/tui-demos -maxdepth 1 -name '*.svg' | wc -l)" -eq 11
      - name: Upload TUI demonstrations
        uses: actions/upload-artifact@v4
        with:
          name: simpleworkflow-tui-demos
          path: /tmp/tui-demos/*.svg
          if-no-files-found: error
      - name: Verify checkout stayed clean
        run: |
          git status --short
          test -z "$(git status --porcelain)"
