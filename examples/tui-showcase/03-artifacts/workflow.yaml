format_version: 1

workflow:
  name: tui_artifacts_and_contracts

context:
  python: python
  work: demo-work

tasks:
  - name: create_workspace
    cwd: .
    argv:
      - "{python}"
      - -c
      - >-
        from pathlib import Path; p=Path('{work}'); p.mkdir(exist_ok=True);
        (p/'input.txt').write_text('alpha\\nbeta\\ngamma\\n')
    outputs:
      required:
        - "{work}/input.txt"
      checks:
        - path: "{work}/input.txt"
          kind: file
          nonempty: true

  - name: transform
    depends_on: [create_workspace]
    env:
      DEMO_PREFIX: processed
    argv:
      - "{python}"
      - -c
      - >-
        import os; from pathlib import Path; src=Path('input.txt'); dst=Path('output.txt');
        dst.write_text(os.environ['DEMO_PREFIX']+'\\n'+src.read_text())
    cwd: "{work}"
    inputs:
      required:
        - "{work}/input.txt"
    outputs:
      required:
        - "{work}/output.txt"
      checks:
        - path: "{work}/output.txt"
          kind: file
          nonempty: true
          min_size: 10
    input_fingerprint: sha256

  - name: summarize
    depends_on: [transform]
    cwd: .
    argv:
      - "{python}"
      - -c
      - "from pathlib import Path; text=Path('{work}/output.txt').read_text(); print(text); print('characters:', len(text))"
    inputs:
      required:
        - "{work}/output.txt"

  - name: disabled_optional_export
    enabled: false
    argv:
      - "{python}"
      - -c
      - "print('Optional export disabled')"
