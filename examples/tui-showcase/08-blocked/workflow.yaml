format_version: 1

workflow:
  name: tui_blocked_demo

context:
  python: python

tasks:
  - name: disabled_prerequisite
    enabled: false
    argv:
      - "{python}"
      - -c
      - "print('disabled')"

  - name: blocked_downstream
    depends_on: [disabled_prerequisite]
    argv:
      - "{python}"
      - -c
      - "print('This must not execute')"
