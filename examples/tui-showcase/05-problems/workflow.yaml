format_version: 1

workflow:
  name: tui_problem_demo

context:
  python: python
  work: problem-work

tasks:
  - name: setup
    argv:
      - "{python}"
      - -c
      - "from pathlib import Path; Path('{work}').mkdir(exist_ok=True); print('setup ok')"

  - name: successful_task
    depends_on: [setup]
    argv:
      - "{python}"
      - -c
      - "print('This task succeeds before the intentional failure')"

  - name: intentional_failure
    depends_on: [successful_task]
    argv:
      - "{python}"
      - -c
      - "import sys; print('About to fail'); print('Intentional error for TUI demonstration', file=sys.stderr); sys.exit(7)"

  - name: never_reached
    depends_on: [intentional_failure]
    argv:
      - "{python}"
      - -c
      - "print('This should not run')"
