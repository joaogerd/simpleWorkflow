format_version: 1

workflow:
  name: synthetic_temperature_reproducibility

context:
  python: python

tasks:
  - name: generate_synthetic_series
    cwd: "."
    argv: ["{python}", "pipeline.py", "generate", "--output", "data/monthly_temperature.csv"]
    inputs:
      required: ["pipeline.py"]
    outputs:
      required: ["data/monthly_temperature.csv"]
      checks:
        - path: "data/monthly_temperature.csv"
          kind: file
          nonempty: true

  - name: compute_monthly_anomalies
    cwd: "."
    argv: ["{python}", "pipeline.py", "anomalies", "--input", "data/monthly_temperature.csv", "--output", "data/monthly_anomalies.csv"]
    depends_on: [generate_synthetic_series]
    inputs:
      required: ["pipeline.py", "data/monthly_temperature.csv"]
    outputs:
      required: ["data/monthly_anomalies.csv"]
      checks:
        - path: "data/monthly_anomalies.csv"
          kind: file
          nonempty: true

  - name: estimate_linear_trend
    cwd: "."
    argv: ["{python}", "pipeline.py", "summary", "--input", "data/monthly_anomalies.csv", "--output", "data/trend_summary.json"]
    depends_on: [compute_monthly_anomalies]
    inputs:
      required: ["pipeline.py", "data/monthly_anomalies.csv"]
    outputs:
      required: ["data/trend_summary.json"]
      checks:
        - path: "data/trend_summary.json"
          kind: file
          nonempty: true
